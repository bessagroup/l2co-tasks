[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=43.0.0", "wheel"]

[project]
authors = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "Martin van der Schelling"}
]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3"
]
dependencies = [
  "bbob-jax>=1.6.2",
  "cloudpickle>=3.1.1",
  "equinox>=0.13.0",
  "f3dasm",
  "jax",
  "jaxtyping>=0.3.2",
  "mnist1d",
  "numpy",
  "optax<=0.2.4",
  "pandas"
]
description = "Optimization tasks compatible with the L2CO library"
keywords = ["optimization", "tasks", "benchmarking"]
license = {text = "BSD-3-Clause"}
maintainers = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "Martin van der Schelling"}
]
name = "l2co-tasks"
readme = "README.md"
requires-python = ">= 3.12"
version = "0.1.0"

[project.optional-dependencies]
dev = [
  "setuptools>=43.0.0",
  "build",
  "wheel",
  "pre-commit>=4.4.0",
  "ruff>=0.14.10"
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-include-exclude-files>=0.1.0",
  "mkdocs-ipynb>=0.1.1",
  "mkdocs-material>=9.6.20",
  "mkdocstrings>=0.30.1",
  "mkdocstrings-python>=1.18.2",
  "pymdown-extensions>=10.16.1"
]
tests = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1"
]

[project.urls]
bugs = "https://github.com/mpvanderschelling/l2co_tasks/issues"
homepage = "https://github.com/mpvanderschelling/l2co_tasks"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
exclude = [
  "__pycache__",
  "dist",
  "*.egg",
  "tests",
  ".git"
]
ignore = [
  "E226",
  "E3",
  "E731",
  "C901",
  "UP045",
  "B027",
  "B012"
]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "UP" # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.uv]
package = true

[tool.uv.sources]
f3dasm = {editable = true, path = "../f3dasm"}
