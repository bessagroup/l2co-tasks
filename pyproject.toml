[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0.0", "wheel"]

[project]
authors = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "Martin van der Schelling"}
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3"
]
dependencies = [
  "bbob-jax>=2.1.0",
  "cloudpickle>=3.1.1",
  "equinox>=0.13.0",
  "f3dasm",
  "hydra-core>=1.3.2",
  "jax",
  "jaxtyping>=0.3.2",
  "mnist1d",
  "numpy",
  "omegaconf",
  "optax>=0.2.5",
  "pandas"
]
description = "Optimization tasks compatible with the L2CO library"
keywords = ["optimization", "tasks", "benchmarking"]
license = "BSD-3-Clause"
maintainers = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "Martin van der Schelling"}
]
name = "l2co-tasks"
readme = "README.md"
requires-python = ">= 3.12"
version = "0.3.0"

[project.optional-dependencies]
cutest = [
  "pycutest>=1.8,<2"
]
dev = [
  "setuptools>=77.0.0",
  "build",
  "wheel",
  "pre-commit>=4.4.0",
  "ruff>=0.14.10"
]
docs = [
  "mkdocs>=1.6.0,<2",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-include-exclude-files>=0.1.0",
  "mkdocs-ipynb>=0.1.1",
  "mkdocs-material>=9.6.20",
  "mkdocstrings>=0.30.1",
  "mkdocstrings-python>=1.18.2",
  "pymdown-extensions>=10.16.1"
]
tests = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1"
]

[project.urls]
bugs = "https://github.com/bessagroup/l2co-tasks/issues"
homepage = "https://github.com/bessagroup/l2co-tasks"

[tool.pytest.ini_options]
filterwarnings = [
  "error::DeprecationWarning:l2co_tasks"
]
markers = [
  "slow: test writes a dataset .npz or runs an inner training loop",
  "requires_f3dasm: test constructs an f3dasm.ExperimentData",
  "requires_l2co: drives tasks through l2co (skipped unless l2co imports)"
]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
exclude = [
  "__pycache__",
  "dist",
  "*.egg",
  ".git"
]
ignore = [
  "E226",
  "E3",
  "E731",
  "C901",
  "UP045",
  "B027",
  "B012"
]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "UP", # pyupgrade
  "TID251" # flake8-tidy-imports banned-api
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"l2co".msg = "l2co-tasks must not know optimizers; l2co bridges Task and OptimizationStep (l2co ADR 0018)."
"l2co_optimizers".msg = "l2co-tasks must not know optimizers; l2co bridges Task and OptimizationStep (l2co ADR 0018)."

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
# Integration tests import l2co on purpose (pytest.importorskip); the
# ADR 0018 ban guards the shipped package only.
"tests/**" = ["TID251"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.setuptools.package-data]
"l2co_tasks._src" = ["*.csv"]
"l2co_tasks.conf" = ["**/*.yaml"]

[tool.uv]
package = true

[tool.uv.sources]
f3dasm = {editable = true, path = "../f3dasm"}
