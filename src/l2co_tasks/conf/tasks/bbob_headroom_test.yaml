# bbob_headroom_test — jointly ERTD-balanced subset across the 3 BBOB suites.
#
# 100 tasks (bbob: 25, bbob_embedded: 50, bbob_noisy: 25).
# Optimizers and tasks were selected *jointly*: maximise the oracle headroom
# gap = VBS - level over the 4 schedules, subject to
#   * balance   : per-optimizer level spread <= 0.02
#   * usefulness: VBS >= level_o + 0.02 for EVERY databank schedule,
#                 so a perfect selector over the 4 beats every fixed single
#                 optimizer (the SBS), lbfgs included
#   * coverage  : >= 25 tasks from each suite
#   * quality   : each of the 4 ranks in the top 12 of the 52-schedule field,
#                 so the headroom is not manufactured from weak optimizers
#
# Schedules: lbfgs, rprop_learning_rate=0.001, crfmnes, mr15ga
# (pool ranks [1, 2, 3, 8] of 52; 2 gradient-based, 2 derivative-free)
#
# Achieved on this half: level=0.3195 spread=0.0200 VBS=0.6091
# gap=0.2896; SBS=lbfgs 0.3297 -> VBS-SBS=+0.2794.
# Per-optimizer levels: {'lbfgs': 0.3297, 'rprop_learning_rate=0.001': 0.3097, 'crfmnes': 0.3289, 'mr15ga': 0.3098}.
#
# Functions are disjoint from the paired train set, which was built by the
# same recipe -- it is a held-out check that the balance generalises, and it
# reproduces this half closely (see docs/plans/headroom-dataset.md in
# l2co_experiments).
#
# Composite config: `parts` lists one task factory per suite, each with
# explicit input_data rows (consumed verbatim). The parts-aware
# create_experimentdata builds each part and row-concatenates the tasks.
sampler:
  _target_: f3dasm.create_sampler
  sampler: "random"  # identity: n_samples=0 appends no rows
sampler_kwargs:
  n_samples: 0

parts:
  # bbob: 25 tasks
  - data_generator:
      _target_: l2co_tasks.create_bbob_task
      _partial_: True
    task_kwargs:
