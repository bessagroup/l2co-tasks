# Balanced test set — ERTD-balanced subset across the 3 BBOB suites.
#
# 284 tasks selected (of 474 on the test function
# half). Objective: maximize the virtual-best-solver (per-task oracle)
# auc_logcost subject to keeping the 4 medium-config optimizers balanced.
# Balance: spread=0.060, common level=0.330.
# VBS (oracle)=0.494, selection headroom (VBS-level)=0.164.
# Per-optimizer means: {'lbfgs': 0.3749, 'sepcmaes': 0.3149, 'adam': 0.3149, 'pso': 0.3149}.
# Per-suite counts: {'bbob': 52, 'bbob_embedded': 173, 'bbob_noisy': 59}.
#
# Composite config: `parts` lists one task factory per suite, each with
# explicit input_data rows (consumed verbatim). The parts-aware
# create_experimentdata (create_optimization_dataset) builds each part and
# row-concatenates the resulting tasks. Disjoint functions from the paired
# train set; same balancing recipe.
sampler:
  _target_: f3dasm.create_sampler
  sampler: "random"  # identity: n_samples=0 appends no rows
sampler_kwargs:
  n_samples: 0

parts:
  # bbob: 52 tasks
