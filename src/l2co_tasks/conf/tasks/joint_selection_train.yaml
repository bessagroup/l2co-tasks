schema:
  # Only the features every task of the five suites tags. `separable`
  # (BBOB suites only) and the CEC structure flags (multimodal,
  # composition, hybrid, rotated) are left out: encoding them for a mixed
  # set needs tolerate_missing, whose missingness pattern is close to a
  # suite identifier (l2co.task_features). `deterministic` is derived from
  # the `noise` tag (l2co.features.DERIVED_FEATURES), so no task hash
  # changes: false for exactly the bbob_noisy tasks.
  dimensionality: continuous
  unimodal: boolean
  deterministic: boolean
