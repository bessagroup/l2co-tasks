sampler:
  _target_: f3dasm.create_sampler
  sampler: 'random'
  seed: ${seed}
sampler_kwargs:
  n_samples: 10
experimentdata:
  domain:
    input:
      seed:
        type: int
        low: 0
        high: 10000
task_kwargs:
  dim_points: 2
  num_samples_per_gaussian: 25
  num_gaussians: 4
  l2_regularization: 0.0005
  inner_steps: 20
  dataset_path: './data/gaussian_classification'
data_generator:
  _target_: l2co_tasks.create_gaussian_meta_task
  _partial_: True

schema:
  # Feature schema used by FeatureProcessor to encode task metadata for the model
  dimensionality: continuous
