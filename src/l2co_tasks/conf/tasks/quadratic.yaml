sampler:
  _target_: f3dasm.create_sampler
  sampler: "random"
  seed: ${seed}
sampler_kwargs:
  n_samples: 90

experimentdata:
  domain:
    input:
      seed:
        type: int
        low: 0
        high: 1000
      dimensionality:
        type: int
        low: 10
        high: 50

task_kwargs:

data_generator:
  _target_: l2co_tasks.create_quadratic_task
  _partial_: True

schema:
  # Feature schema used by FeatureProcessor to encode task metadata for the model
  dimensionality: continuous
