sampler:
  _target_: f3dasm.create_sampler
  sampler: "grid"
sampler_kwargs:


experimentdata:
  domain:
    input:
      seed:
        type: int
        low: 0
        high: 10
      hidden_size:
        type: category
        categories:
          - 2
          - 4
          - 6
      num_layers:
        type: category
        categories:
          - 2
          - 3
          - 4



task_kwargs:
  dim_points: 2
  num_samples_per_gaussian: 25
  num_gaussians: 4
  l2_regularization: 0.0005
  hidden_size: 2
  num_layers: 2
  dataset_path: './data/gaussian_classification'

data_generator:
  _target_: l2co_tasks.create_gaussian_task
  _partial_: True

schema:
  # Feature schema used by FeatureProcessor to encode task metadata for the model
  dimensionality: continuous
