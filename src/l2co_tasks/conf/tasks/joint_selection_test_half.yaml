# joint_selection_test_half -- the whole test half of the DATASET
# benchmark's split: every problem of the base-landscape half that
# joint_selection_test was chosen from, before the selection, on the
# re-run's databank (databank_2026_11: starts uniform in the box,
# evaluation budget min(10^3 d, 10^5)). It shows how the portfolio does
# on problems that were not picked because choosing per problem pays.
#
# 339 tasks (bbob: 72, bbob_embedded: 96, bbob_noisy: 90, cec2005: 36, cec2017: 45).
#
# Split (l2co_experiments experiments/joint_selection, run of
# 2026-11-14; /oscar/data/mbessa/mvander7/joint_selection/
#   2026-11-14_rerun_fixed_portfolio/main/train.json, "split", and
#   test.json, "half"):
#   * pool: seed 0 of every configuration of bbob, bbob_noisy, bbob_embedded
#     (64 and 1024 ambient dimensions), cec2005 and cec2017, 678 problems,
#     split by base landscape (ADR 0007) into two halves of 339 (split
#     seed 0); this set is the test half, all of it;
#   * u = normalised ERTD AUC over log10 evaluations per dimension, 0.1 to
#     2.5e4 (5.4 decades; u_matrix.csv sha256 995903c5...), with the
#     overhead rule: u = 0 for a cell over 0.5 s per step (25 runs, after a
#     300 s start-up allowance), i.e. the five full-covariance candidates at
#     d = 1024. Delta = mean over the problems of the portfolio's
#     per-problem best (VBS) minus the best mean of any single one of the
#     60 candidates (SBS).
#
# On the whole half, for joint_selection_test's portfolio (test.json,
# "transfer", "before_selection"): N = 339, Delta = 0.1004;
# VBS = 0.4180, SBS = lbfgs 0.3176.
# Portfolio:
#   crfmnes_std_init=0.2
#   mr15ga_std_init=0.2
#   rprop_learning_rate=0.01
#   lbfgs
# Problems won (crfmnes, mr15ga, rprop, lbfgs): 118 / 35 / 55 / 131.
#
# Contains every problem of joint_selection_test. Functions are disjoint
# from joint_selection_train: every base landscape lies in one half only.
#
# Composite config: `parts` lists one task factory per suite, each with
# explicit input_data rows (consumed verbatim). The parts-aware
# create_tasks_experimentdata builds each part and row-concatenates the
# tasks.
sampler:
  _target_: f3dasm.create_sampler
  sampler: "random"  # identity: n_samples=0 appends no rows
sampler_kwargs:
  n_samples: 0

