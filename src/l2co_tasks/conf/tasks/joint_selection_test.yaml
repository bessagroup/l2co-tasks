# joint_selection_test -- the DATASET benchmark's test set:
# 100 problems from five suites on which choosing the best of four
# optimizers per problem clearly beats the best single optimizer
# (DATASET paper, Sections 3.3-4.1), on the re-run's databank
# (databank_2026_11: starts uniform in the box, evaluation budget
# min(10^3 d, 10^5)).
#
# 100 tasks (bbob: 16, bbob_embedded: 38, bbob_noisy: 32, cec2005: 5, cec2017: 9).
#
# Selection (l2co_experiments experiments/joint_selection, run of
# 2026-11-14; /oscar/data/mbessa/mvander7/joint_selection/
#   2026-11-14_rerun_fixed_portfolio/main/test.json):
#   * pool: seed 0 of every configuration of bbob, bbob_noisy, bbob_embedded
#     (64 and 1024 ambient dimensions), cec2005 and cec2017, 678 problems,
#     split by base landscape (ADR 0007) into two halves of 339;
#   * this half: the portfolio is the training half's, held fixed; the problems were
#     chosen for it under the same constraints at a fixed N = 100.
#   * u = normalised ERTD AUC over log10 evaluations per dimension, 0.1 to
#     2.5e4 (5.4 decades; u_matrix.csv sha256 995903c5...), with the
#     overhead rule: u = 0 for a cell over 0.5 s per step (25 runs, after a
#     300 s start-up allowance), i.e. the five full-covariance candidates at
#     d = 1024. Delta = mean over the problems of the portfolio's
#     per-problem best (VBS) minus the best mean of any single one of the
#     60 candidates (SBS).
#   * constraints: floor Delta >= 1/6; balance, no member more than 0.06
#     above the members' mean; separation, on every problem the best
#     member beats the members' mean by >= 0.02; no per-suite minimum.
#
# Achieved on this half: N = 100 of 339, Delta = 0.2477
# (proven optimal for this portfolio); VBS = 0.5388, SBS = lbfgs 0.2911.
# Portfolio:
#   crfmnes_std_init=0.2
#   mr15ga_std_init=0.2
#   rprop_learning_rate=0.01
#   lbfgs
# Problems won (crfmnes, mr15ga, rprop, lbfgs): 33 / 16 / 28 / 23.
#
# Functions are disjoint from joint_selection_train: every base landscape lies in
# one half only. Seeds 1-3 of the same configurations are not in this
# set; they test whether the gap holds on other instances.
#
# Composite config: `parts` lists one task factory per suite, each with
# explicit input_data rows (consumed verbatim). The parts-aware
# create_tasks_experimentdata builds each part and row-concatenates the
# tasks.
sampler:
  _target_: f3dasm.create_sampler
  sampler: "random"  # identity: n_samples=0 appends no rows
sampler_kwargs:
  n_samples: 0

