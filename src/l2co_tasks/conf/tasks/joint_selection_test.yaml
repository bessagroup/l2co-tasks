# joint_selection_test -- the DATASET benchmark's test set:
# 100 problems from five suites on which choosing the best of four
# optimizers per problem clearly beats the best single optimizer
# (DATASET paper, Sections 3.3-3.4).
#
# 100 tasks (bbob: 17, bbob_embedded: 39, bbob_noisy: 25, cec2005: 12, cec2017: 7).
#
# Selection (l2co_experiments experiments/joint_selection, run of
# 2026-10-27; /oscar/data/mbessa/mvander7/joint_selection/
# 2026-10-27_seed0_n100/main/test.json):
#   * pool: seed 0 of every configuration of bbob, bbob_noisy, bbob_embedded
#     (64 and 1024 ambient dimensions), cec2005 and cec2017, 678 problems,
#     split by base landscape (ADR 0007) into two halves of 339;
#   * this half: the portfolio was fixed by joint_selection_train; only
#     the problems were chosen, at the same N = 100, maximising Delta,
#     so this half never influenced the portfolio.
#   * u = normalised ERTD AUC over log10 evaluations per dimension, 0.1 to
#     1e5 (six decades; u_matrix.csv sha256 bb29ec8d...). Delta = mean
#     over the problems of the portfolio's per-problem best (VBS) minus
#     the best mean of any single one of the 60 candidates (SBS).
#   * constraints: floor Delta >= 1/6 (choosing within the portfolio is
#     ~10x cheaper than the SBS); balance, no member more than 0.06 above
#     the members' mean (~2.3x); separation, on every problem the best
#     member beats the members' mean by >= 0.02; no per-suite minimum.
#
# Achieved on this half: N = 100 of 339, Delta = 0.2294
# (proven optimal); VBS = 0.5237, SBS = lbfgs 0.2943.
# Portfolio:
#   crfmnes
#   adafactor
#   sgd_learning_rate=0.001
#   lbfgs
# Problems won (crfmnes, adafactor, sgd, lbfgs): 38 / 25 / 8 / 29.
#
# Functions are disjoint from joint_selection_train: every base landscape lies in
# one half only. Seeds 1-3 of the same configurations are not in this
# set; they test whether the gap holds on other instances.
#
# Composite config: `parts` lists one task factory per suite, each with
# explicit input_data rows (consumed verbatim). The parts-aware
# create_tasks_experimentdata builds each part and row-concatenates the
# tasks.
sampler:
  _target_: f3dasm.create_sampler
  sampler: "random"  # identity: n_samples=0 appends no rows
sampler_kwargs:
  n_samples: 0

