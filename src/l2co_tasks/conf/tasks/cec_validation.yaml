# CEC2005 validation suite: f1–f22 × {10,30} × 10 instances.
#
# For the task-specification validation harness
# (l2co_experiments: validate_task_specifications). EXCLUDES f23/f24/f25,
# which carry structure_modified=True (deliberately altered from the CEC
# 2005 spec for JAX) and so cannot be compared to the literature. The
# noise functions f4 and f17 are kept here but bucketed separately by the
# analysis (their global_min-relative target is unreliable under noise).
sampler:
  _target_: f3dasm.create_sampler
  sampler: "grid"
sampler_kwargs:

experimentdata:
  domain:
    input:
      fn_name:
        type: category
        categories:
          - 'f1'
          - 'f2'
          - 'f3'
          - 'f4'
          - 'f5'
          - 'f6'
          - 'f7'
          - 'f8'
          - 'f9'
          - 'f10'
          - 'f11'
          - 'f12'
          - 'f13'
          - 'f14'
          - 'f15'
          - 'f16'
          - 'f17'
          - 'f18'
          - 'f19'
          - 'f20'
          - 'f21'
          - 'f22'
      dimensionality:
        type: category
        categories:
          - 10
          - 30
      seed:
        type: int
        low: 0
        high: 9   # range(0, 10) -> 10 instances per (fn, dim)

task_kwargs:

data_generator:
  _target_: l2co_tasks.create_cec2005_task
  _partial_: True

schema:
  dimensionality: continuous
  unimodal: boolean
  multimodal: boolean
  composition: boolean
  rotated: boolean
