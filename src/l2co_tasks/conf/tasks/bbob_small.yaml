# BBOB subset: 10 representative functions (2 per difficulty group) × 3 dimensions
sampler:
  _target_: f3dasm.create_sampler
  sampler: "grid"
sampler_kwargs:

experimentdata:
  domain:
    input:
      fn_name:
        type: category
        categories:
        # Separable
          - 'sphere'
          - 'rastrigin_seperable'
        # Low or moderate conditioning
          - 'step_ellipsoid'
          - 'rosenbrock'
        # High conditioning and unimodal
          - 'discuss'
          - 'bent_cigar'
        # Multimodal with adequate gloabl structure
          - 'rastrigin'
          - 'griewank_rosenbrock_f8f2'
        # Multi-modal with weak global structure
          - 'schwefel_xsinx'
          - 'lunacek_bi_rastrigin'
      dimensionality:
        type: category
        categories:
          - 3
          - 5
          - 20
      seed:
        type: int
        low: 0
        high: 0

task_kwargs:

data_generator:
  _target_: l2co_tasks.create_bbob_task
  _partial_: True

schema:
  # Feature schema used by FeatureProcessor to encode task metadata for the model
  dimensionality: continuous
  separable: boolean
  unimodal: boolean
