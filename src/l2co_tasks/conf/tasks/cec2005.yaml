sampler:
  _target_: f3dasm.create_sampler
  sampler: "grid"
sampler_kwargs:

experimentdata:
  domain:
    input:
      fn_name:
        type: category
        categories:
          - 'f1'
          - 'f2'
          - 'f3'
          - 'f4'
          - 'f5'
          - 'f6'
          - 'f7'
          - 'f8'
          - 'f9'
          - 'f10'
          - 'f11'
          - 'f12'
          - 'f13'
          - 'f14'
          - 'f15'
          - 'f16'
          - 'f17'
          - 'f18'
          - 'f19'
          - 'f20'
          - 'f21'
          - 'f22'
          - 'f23'
          - 'f24'
          - 'f25'
      dimensionality:
        type: category
        categories:
          - 10
          - 30
          - 50
      # 4 instance seeds per (function, dimensionality), as in bbob.yaml:
      # bbob-jax samples each instance's shift/rotation (and global_min)
      # from the key, so each seed is a distinct instance rather than a
      # repeat. Rollout repeats are a separate axis (`n_realizations`).
      seed:
        type: int
        low: 0
        high: 3

task_kwargs:

data_generator:
  _target_: l2co_tasks.create_cec2005_task
  _partial_: True

schema:
  dimensionality: continuous
  unimodal: boolean
  multimodal: boolean
  composition: boolean
  rotated: boolean

# [lower, upper] for bounded tasks, omit (or null) for unbounded.
bounded:
