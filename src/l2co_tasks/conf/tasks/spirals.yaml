sampler:
  _target_: f3dasm.create_sampler
  sampler: "random"
  seed: ${seed}
sampler_kwargs:
  n_samples: 3
experimentdata:
  domain:
    input:
      hidden_size:
        type: int
        low: 4
        high: 64
task_kwargs:
  dataset_size: 1000
  batch_size: 16
  dataset_path: './data/spirals.npz'
  seed: ${seed}
data_generator:
  _target_: l2co_tasks.create_spiral_task
  _partial_: True

schema:
  # Feature schema used by FeatureProcessor to encode task metadata for the model
  dimensionality: continuous

# Optimization domain (RNN parameters are unconstrained). Set to a
# [lower, upper] for bounded tasks, omit (or null) for unbounded.
bounded:
