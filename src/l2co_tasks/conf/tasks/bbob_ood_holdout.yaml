# Out-of-distribution (held-out *function*) counterpart of
# ``bbob_diverse`` for the hard generalization bar.
#
# In contrast to ``bbob_diverse_holdout`` (which holds out *instances* --
# the same 7 training functions at new seeds, an in-distribution test),
# this set holds out entire BBOB *functions*: every function here is
# disjoint from the 7 in ``bbob_diverse``. Each is chosen so its
# (separable, unimodal) signature already appears in training, so the
# FeatureProcessor never sees an unseen categorical level -- the model is
# asked to generalize to a new landscape with a familiar feature
# signature, the clean OOD-by-function test that feature-based algorithm
# selection has historically struggled to clear.
#
# Coverage vs. the training feature combinations:
#   linear_slope             (separable, unimodal)   <- like sphere
#   ellipsoid                (non-sep,   unimodal)   <- like rosenbrock / bent_cigar
#   sharp_ridge              (non-sep,   unimodal)   <- like step_ellipsoid
#   weierstrass              (non-sep,   multimodal) <- like rastrigin
#   schaffer_f7_condition_10 (non-sep,   multimodal) <- like schwefel_xsinx
#   gallagher_21_peaks       (non-sep,   multimodal) <- like gallagher_101_peaks
#
#   6 functions x 3 dimensions x 1 seed = 18 held-out (OOD) tasks.
sampler:
  _target_: f3dasm.create_sampler
  sampler: "grid"  # one row per (fn_name x dimensionality x seed)
sampler_kwargs:

experimentdata:
  domain:
    input:
      fn_name:
        type: category
        categories:
        # separable, unimodal
          - 'linear_slope'
        # non-separable, unimodal
          - 'ellipsoid'
          - 'sharp_ridge'
        # non-separable, multimodal
          - 'weierstrass'
          - 'schaffer_f7_condition_10'
          - 'gallagher_21_peaks'
      dimensionality:
        type: category
        categories:
          - 2
          - 10
          - 40
      seed:
        type: int
        low: 0
        high: 0

task_kwargs:  # Extra keyword args forwarded to the task factory (null = none)

data_generator:
  # Factory function that creates a Task object from each ExperimentData row
  _target_: l2co_tasks.create_bbob_task
  _partial_: True

schema:
  # Feature schema used by FeatureProcessor to encode task metadata for the model
  dimensionality: continuous
  separable: boolean
  unimodal: boolean
