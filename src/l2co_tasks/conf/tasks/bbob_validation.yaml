# BBOB validation suite: all 24 functions × {2,10,40} × 10 instances.
#
# Purpose-built for the task-specification validation harness
# (l2co_experiments: validate_task_specifications). Unlike bbob.yaml
# (1 seed), this samples 10 rotations per (function, dimension) so the
# relational contrasts have an across-instance noise floor.
sampler:
  _target_: f3dasm.create_sampler
  sampler: "grid"  # one row per (fn_name × dimensionality × seed)
sampler_kwargs:

experimentdata:
  domain:
    input:
      fn_name:
        type: category
        categories:
          - 'attractive_sector'
          - 'bent_cigar'
          - 'discuss'
          - 'ellipsoid'
          - 'ellipsoid_seperable'
          - 'gallagher_101_peaks'
          - 'gallagher_21_peaks'
          - 'griewank_rosenbrock_f8f2'
          - 'katsuura'
          - 'linear_slope'
          - 'lunacek_bi_rastrigin'
          - 'rastrigin'
          - 'rastrigin_seperable'
          - 'rosenbrock'
          - 'rosenbrock_rotated'
          - 'schaffer_f7_condition_10'
          - 'schaffer_f7_condition_1000'
          - 'schwefel_xsinx'
          - 'sharp_ridge'
          - 'skew_rastrigin_bueche'
          - 'sphere'
          - 'step_ellipsoid'
          - 'sum_of_different_powers'
          - 'weierstrass'
      dimensionality:
        type: category
        categories:
          - 2
          - 10
          - 40
      seed:
        type: int
        low: 0
        high: 9   # range(0, 10) -> 10 instances per (fn, dim)

task_kwargs:

data_generator:
  _target_: l2co_tasks.create_bbob_task
  _partial_: True

schema:
  dimensionality: continuous
  separable: boolean
  unimodal: boolean

bounded:
