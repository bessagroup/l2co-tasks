sampler:
  _target_: f3dasm.create_sampler
  sampler: 'random'
  seed: ${seed}
sampler_kwargs:
  n_samples: 100
experimentdata:
  domain:
    input:
      seed:
        type: int
        low: 0
        high: 100000
task_kwargs:
  dataset_size: 1000
  batch_size: 16
  dataset_path: './data/mnist1d.npz'
data_generator:
  _target_: l2co_tasks.create_mnist1d_task
  _partial_: True

schema:
  # Feature schema used by FeatureProcessor to encode task metadata for the model
  dimensionality: continuous

# Optimization domain (NN parameters are unconstrained). Set to a
# [lower, upper] for bounded tasks, omit (or null) for unbounded.
bounded:
